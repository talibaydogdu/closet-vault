[project]
name = "closet-vault"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6", "psycopg[binary]>=3.2", "Pillow>=11", "gunicorn>=23", "whitenoise>=6.8",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]
[tool.ruff]
line-length = 100
exclude = ["inventory/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
