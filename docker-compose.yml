services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    volumes: [media_data:/app/media]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8000/health/"], interval: 30s, timeout: 5s, retries: 3}
volumes: {postgres_data: {}, media_data: {}}
