<section class="card my-3"><div class="card-header d-flex justify-content-between"><h2 class="h5">{{ title }}</h2><a class="btn btn-sm btn-success" href="{% url 'crud-create' kind %}">Yeni</a></div><div class="list-group list-group-flush">{% for object in objects %}<div class="list-group-item d-flex justify-content-between">{{ object }}<span><a class="btn btn-sm btn-outline-primary" href="{% url 'crud-update' kind object.pk %}">Düzenle</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'crud-delete' kind object.pk %}">Sil</a></span></div>{% empty %}<div class="list-group-item">Kayıt yok.</div>{% endfor %}</div></section>
