{% load static %}<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dolap Kasası</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'inventory/app.css' %}"><script src="https://unpkg.com/htmx.org@2.0.4"></script></head><body>
<nav class="navbar navbar-dark bg-dark sticky-top"><div class="container"><a class="navbar-brand" href="{% url 'catalog' %}">Dolap Kasası</a>{% if user.is_authenticated %}<div class="d-flex gap-2"><a class="btn btn-success" href="{% url 'item-create' %}">+ Ürün</a><a class="btn btn-outline-light" href="{% url 'manage' %}">Yönetim</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light">Çıkış</button></form></div>{% endif %}</div></nav>
<main class="container py-4">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
